<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark synthwave container with neon border -->
  <rect width="64" height="64" rx="14" fill="#090014" />
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="#FF00FF" stroke-width="2" stroke-opacity="0.8" />
  
  <!-- Outrun Horizon line -->
  <line x1="8" y1="44" x2="56" y2="44" stroke="#00FFFF" stroke-width="2" stroke-opacity="0.6" />
  <line x1="16" y1="52" x2="48" y2="52" stroke="#FF9900" stroke-width="1.5" stroke-opacity="0.5" />
  <line x1="24" y1="58" x2="40" y2="58" stroke="#FF9900" stroke-width="1" stroke-opacity="0.4" />

  <!-- Neon Glowing Chevron / Drop Arrow -->
  <polygon points="32,38 18,20 26,20 32,28 38,20 46,20" fill="url(#neon-gradient)" />
  <circle cx="32" cy="14" r="4" fill="#00FFFF" />

  <defs>
    <linearGradient id="neon-gradient" x1="18" y1="20" x2="46" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="50%" stop-color="#FF00FF" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>
  </defs>
</svg>