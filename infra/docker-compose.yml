services:
  signaling:
    build:
      context: ..
      dockerfile: apps/signaling/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - STUN_URLS=stun:stun.l.google.com:19302
      - LOG_LEVEL=info
    restart: unless-stopped

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "49152-49200:49152-49200/udp"
    command:
      - -n
      - --log-file=stdout
      - --min-port=49152
      - --max-port=49200
      - --realm=dropzone.local
      - --use-auth-secret
      - --static-auth-secret=dropzone-dev-secret
