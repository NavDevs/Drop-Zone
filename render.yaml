# Render Blueprint — hosts BOTH halves of DropZone in a single Web Service:
#
#   dropzone  Socket.IO server + Static SPA  → Docker; one process, one keep-alive.
#
# The service is on the free compute plan and spins down after 15 min without 
# inbound traffic — see docs/DEPLOYMENT.md for the keep-alive that prevents it.
#
# Deploy: Render Dashboard → New → Blueprint → select this repository.
# Docs:   https://render.com/docs/blueprint-spec

services:
  - type: web
    name: dropzone
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/signaling/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: STUN_URLS
        value: stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302,stun:stun2.l.google.com:19302,stun:stun.cloudflare.com:3478
      - key: TURN_URLS
        sync: false
      - key: TURN_SECRET
        generateValue: true
      - key: TURN_TTL_SECONDS
        value: "3600"
      - key: ROOM_TTL_DEFAULT_SEC
        value: "600"
      - key: MAX_PEERS
        value: "8"
      - key: LOG_LEVEL
        value: info
      - key: METRICS_TOKEN
        sync: false
