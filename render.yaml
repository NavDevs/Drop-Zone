# Render Blueprint — hosts BOTH halves of DropZone on one platform:
#
#   dropzone-web        static SPA (apps/web)              → always-on, free, global CDN
#   dropzone-signaling  Socket.IO server (apps/signaling)  → Docker; holds long-lived WebSockets
#
# The static site never sleeps. The web service is on the free compute plan and
# spins down after 15 min without inbound traffic — see docs/DEPLOYMENT.md for
# the keep-alive that prevents it.
#
# Deploy: Render Dashboard → New → Blueprint → select this repository.
# Docs:   https://render.com/docs/blueprint-spec

services:
  # ----------------------------------------------------------------- signaling
  - type: web
    name: dropzone-signaling
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/signaling/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      # The server currently accepts every origin (see docs/DECISIONS.md); this
      # records that explicitly instead of leaving it to the code's fallback.
      - key: CORS_ORIGINS
        value: "*"
      # STUN is required for NAT discovery; blank uses the built-in public servers.
      - key: STUN_URLS
        sync: false
      # TURN relay for symmetric NAT. Blank = direct-only. e.g.
      # turn:turn.example.com:3478,turns:turn.example.com:5349
      - key: TURN_URLS
        sync: false
      - key: TURN_SECRET
        generateValue: true
      - key: TURN_TTL_SECONDS
        value: "3600"
      - key: ROOM_TTL_DEFAULT_SEC
        value: "600"
      - key: MAX_PEERS
        value: "8"
      - key: LOG_LEVEL
        value: info
      # Blank disables GET /metrics entirely.
      - key: METRICS_TOKEN
        sync: false

  # ------------------------------------------------------------------ web (SPA)
  - type: web
    name: dropzone-web
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter web build
    staticPublishPath: ./apps/web/dist
    envVars:
      # Render injects the signaling service's bare hostname here; the client
      # upgrades a scheme-less value to https:// (see `getSignalingUrl` in
      # apps/web/src/lib/signaling/SignalingClient.ts).
      - key: VITE_SIGNALING_URL
        fromService:
          name: dropzone-signaling
          type: web
          property: host
    # Single-page app: every unknown path is served index.html so client-side
    # routes such as /r/ABC123 resolve. Existing files are still served first.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
